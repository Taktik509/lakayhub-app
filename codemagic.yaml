              AA000008 /* LakayHub */ = { isa = PBXGroup; children = ( AA000004 /* ContentView.swift */, AA000005 /* LakayHubApp.swift */, ); path = LakayHub; sourceTree = "<group>"; };
              AA000009 /* Products */ = { isa = PBXGroup; children = ( AA000003 /* LakayHub.app */, ); name = Products; sourceTree = "<group>"; };
          /* End PBXGroup section */
          /* Begin PBXNativeTarget section */
              AA00000A /* LakayHub */ = { isa = PBXNativeTarget; buildConfigurationList = AA000012 /* Build configuration list for PBXNativeTarget "LakayHub" */; buildPhases = ( AA00000B /* Sources */, AA000006 /* Frameworks */, AA00000C /* Resources */, ); buildRules = ( ); dependencies = ( ); name = LakayHub; productName = LakayHub; productReference = AA000003 /* LakayHub.app */; productType = "com.apple.product-type.application"; };
          /* End PBXNativeTarget section */
          /* Begin PBXProject section */
              AA00000D /* Project object */ = { isa = PBXProject; attributes = { LastUpgradeCheck = 1600; TargetAttributes = { AA00000A = { CreatedOnToolsVersion = 16.0; }; }; }; buildConfigurationList = AA00000F /* Build configuration list for PBXProject "LakayHub" */; compatibilityVersion = "Xcode 16.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = ( en, Base, ); mainGroup = AA000007; productRefGroup = AA000009 /* Products */; projectDirPath = ""; projectRoot = ""; targets = ( AA00000A /* LakayHub */, ); };
