      - name: Build unsigned IPA
        script: |
          set -e
          xcodebuild -project ios/LakayHub.xcodeproj -target LakayHub -configuration Release -destination 'generic/platform=iOS' -derivedDataPath derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          rm -rf Payload && mkdir -p Payload
          cp -R derivedData/Build/Products/Release-iphoneos/*.app Payload/
          rm -f LakayHub-unsigned.ipa
          zip -qry LakayHub-unsigned.ipa Payload
    artifacts:
      - LakayHub-unsigned.ipa
