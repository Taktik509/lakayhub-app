# LakayHub CI workflows
workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up Gradle
        script: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle --version
      - name: Build debug APK
        working_directory: android
        script: |
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          set -e
          if [ ! -f ios/LakayHub/LakayHubApp.swift ]; then
            cat > ios/LakayHub/LakayHubApp.swift << 'SWIFT_EOF'
          import SwiftUI

          @main
          struct LakayHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
